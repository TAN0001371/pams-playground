<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dangerous Dave - Trophy Trouble</title>
<style>
  html,body{margin:0;padding:0;background:#0b0b18;color:#ddd;
    font-family:"Courier New",monospace;display:flex;flex-direction:column;align-items:center;
    min-height:100vh;justify-content:center;gap:10px;user-select:none;}
  canvas{image-rendering:pixelated;image-rendering:crisp-edges;border:4px solid #333;
    border-radius:6px;background:#000;max-width:96vw;max-height:82vh;width:auto;height:auto;}
  #hint{font-size:13px;color:#888;text-align:center;line-height:1.7;padding:0 10px;max-width:780px;}
  #hint b{color:#e8c15a;}
</style>
</head>
<body>
<canvas id="g" width="640" height="480"></canvas>
<div id="hint"><b>&larr;&rarr;</b> run &nbsp; <b>Space/&uarr;</b> jump &nbsp; <b>Ctrl/X</b> shoot &nbsp; <b>Shift</b> jetpack &nbsp; <b>&darr;</b> drop &nbsp; <b>R</b> retry level &nbsp; <b>P</b> pause &nbsp; <b>M</b> sound
<br>Chain kills fast for a <b>COMBO MULTIPLIER</b>. Grab every coin. 150 coins = <b>1UP</b>!</div>
<script>
"use strict";
/* ============================================================
   DANGEROUS DAVE: TROPHY TROUBLE  (arcade remix)
   Side-scrolling tribute to the 1990 DOS original, rebuilt for
   modern juice: coins, kill combos, multipliers, stars, 1UPs,
   particles, screen shake, hit-stop and an endless Nightmare
   mode after level 10. Grab the trophy, then reach the door.
   ============================================================ */
const canvas = document.getElementById("g");
const ctx = canvas.getContext("2d");
const TILE = 32, ROWS = 13, HUD = 64, VIEWW = 640, VIEWH = 480;

/*GEN_START*/
// ---------- deterministic level generator (pure, testable in node) ----------
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const LEVEL_NAMES = [
  "A BREEZE", "WIDE OPEN", "THE GAPS", "HAUNTED HILLS",
  "FIRE FIELDS", "HIGH LEDGES", "RUSH HOUR", "BLAZING TRAIL",
  "CLYDE'S FORTRESS", "THE LAIR",
];
const SOLIDG = { "#": 1, G: 1, B: 1 };

function genLevel(i) {
  const rnd = mulberry32(i * 7919 + 13);
  const W = Math.min(64 + i * 6, 112);
  const g = [];
  for (let r = 0; r < ROWS; r++) g.push(Array(W).fill(" "));
  for (let c = 0; c < W; c++) g[12][c] = "G";

  const pits = [], hills = [], plats = [], spikes = [];
  let fires = [];

  const tCol = Math.floor(W * (0.60 + rnd() * 0.12));
  const dCol = W - 5;
  const zone = (c) => (c >= tCol - 5 && c <= tCol + 5) || (c >= dCol - 7) || c < 8;

  let cur = 8;
  const pitChance = Math.min(0.10 + i * 0.055, 0.40);
  const hillChance = i >= 1 ? Math.min(0.10 + i * 0.035, 0.30) : 0;
  const spikeChance = i >= 5 ? Math.min(0.05 + i * 0.02, 0.16) : 0;
  while (cur < W - 18) {
    cur += 3 + Math.floor(rnd() * 5);
    if (cur >= W - 18 || zone(cur)) continue;
    const r = rnd();
    if (r < pitChance) {
      let w = 2 + (rnd() < Math.min(i / 7, 0.55) ? 1 : 0);
      if (w > 3) w = 3;
      for (let cc = cur; cc < cur + w && cc < W - 1; cc++) g[12][cc] = " ";
      pits.push({ c: cur, w }); cur += w + 1;
    } else if (r < pitChance + hillChance) {
      const h = 1 + (rnd() < i / 7 ? 1 : 0);
      const w = 1 + (rnd() < 0.6 ? 1 : 0);
      for (let cc = cur; cc < cur + w && cc < W - 1; cc++)
        for (let rr = 12 - h; rr <= 11; rr++) g[rr][cc] = "#";
      hills.push({ c: cur, w, h }); cur += w + 1;
    } else if (r < pitChance + hillChance + 0.13 && i >= 2) {
      const row = rnd() < 0.6 ? 10 : 9;
      const w = 2 + Math.floor(rnd() * 3);
      const type = rnd() < 0.5 ? "-" : "#";
      for (let cc = cur; cc < cur + w && cc < W - 2; cc++) g[row][cc] = type;
      plats.push({ c: cur, w, row, type }); cur += w + 1;
    } else if (r < pitChance + hillChance + 0.13 + spikeChance && i >= 5) {
      const w = 1 + Math.floor(rnd() * 3);
      let clash = false;
      for (let cc = cur; cc < cur + w; cc++) if (zone(cc) || g[12][cc] !== "G") clash = true;
      if (!clash) {
        for (let cc = cur; cc < cur + w; cc++) g[11][cc] = "S";
        spikes.push({ c: cur, w }); cur += w + 2;
      }
    } else if (i >= 3 && rnd() < 0.55) {
      fires.push(cur); cur += 1;
    }
    if (i >= 4 && !zone(cur) && rnd() < 0.25) fires.push(cur);
  }

  // spawn area flat, no hazards
  for (let c = 0; c < 8; c++) { g[12][c] = "G"; for (let rr = 0; rr < 12; rr++) g[rr][c] = " "; }
  fires = fires.filter(c => c >= 10 && !(c >= tCol - 5 && c <= tCol + 5) && !(c >= dCol - 7));

  // trophy pedestal
  for (let rr = 10; rr <= 11; rr++) { g[rr][tCol] = "#"; g[rr][tCol + 1] = "#"; }
  g[12][tCol] = "G"; g[12][tCol + 1] = "G";

  // door zone flat
  for (let c = dCol - 2; c < W; c++) { g[12][c] = "G"; for (let rr = 0; rr < 12; rr++) g[rr][c] = " "; }

  // ---- coins ----
  const coins = [];
  const coinAt = (c, r) => {
    if (c < 1 || c >= W - 1 || r < 0 || r >= ROWS) return;
    const t = g[r][c];
    if (t !== " " && t !== "-") return;
    coins.push({ x: c * TILE + 16, y: r * TILE + 16 });
  };
  // ground rows (skip spike cols, zones)
  const spikeCols = {};
  spikes.forEach(s => { for (let cc = s.c; cc < s.c + s.w; cc++) spikeCols[cc] = 1; });
  for (let c = 5; c < dCol - 5; c++) {
    if (spikeCols[c] || (c >= tCol - 4 && c <= tCol + 4)) continue;
    if (g[12][c] === "G" && g[11][c] === " " && rnd() < 0.42) coinAt(c, 11);
  }
  // arcs over pits
  pits.forEach(p => {
    const cc = p.c + Math.floor(p.w / 2);
    coinAt(cc, 10); coinAt(cc, 9);
  });
  // on hill tops
  hills.forEach(h => {
    for (let cc = h.c; cc < h.c + h.w; cc++) if (g[11 - h.h] && g[11 - h.h][cc] === " ") coinAt(cc, 11 - h.h);
  });
  // on floating platforms
  plats.forEach(p => {
    for (let cc = p.c; cc < p.c + p.w; cc++) if (g[p.row - 1] && g[p.row - 1][cc] === " ") coinAt(cc, p.row - 1);
  });
  // starter trail to teach the mechanic
  coinAt(4, 11); coinAt(5, 11); coinAt(6, 11);
  // a few high-risk floating coins mid-level
  for (let n = 0; n < Math.min(2 + Math.floor(i / 3), 5); n++) {
    const c = 15 + Math.floor(rnd() * (W - 40));
    if (zone(c) || g[12][c] !== "G") continue;
    coinAt(c + (rnd() < 0.5 ? 0 : 1), 8);
  }

  // ---- hearts (extra life pickups) ----
  const hearts = [];
  if (i >= 1 && rnd() < 0.75) {
    for (let tries = 0; tries < 40; tries++) {
      const c = 12 + Math.floor(rnd() * (W - 34));
      if (zone(c) || g[12][c] !== "G" || spikeCols[c]) continue;
      hearts.push({ col: c }); break;
    }
  }

  // ---- enemies ----
  const foes = [];
  const walkers = Math.min(2 + Math.ceil(i * 1.3), 12);
  let placed = 0, guard = 0;
  while (placed < walkers && guard++ < 400) {
    const c = 10 + Math.floor(rnd() * (W - 24));
    if (c < 9 || (c >= tCol - 4 && c <= tCol + 4) || c >= dCol - 5) continue;
    if (g[12][c] !== "G" || spikeCols[c]) continue;
    foes.push({ kind: "w", fast: i >= 4 && rnd() < 0.4 + i * 0.03, col: c, row: 11 });
    placed++;
  }
  const ghostN = i >= 3 ? Math.min(1 + Math.floor((i - 1) / 2), 5) : 0;
  for (let n = 0; n < ghostN; n++) {
    const c = 20 + Math.floor(rnd() * Math.max(10, W - 40));
    if (c >= dCol - 6) continue;
    foes.push({ kind: "g", col: c, row: 5 + Math.floor(rnd() * 3) });
  }

  // ---- jetpacks ----
  const jets = [];
  const jetN = i >= 2 ? 1 + (i >= 5 ? 1 : 0) : 0;
  for (let n = 0; n < jetN; n++) {
    const c = 12 + Math.floor(rnd() * (W - 34));
    if (g[12][c] !== "G" || spikeCols[c] || (c >= tCol - 4 && c <= tCol + 4) || c >= dCol - 6) continue;
    jets.push({ col: c });
  }

  return {
    name: LEVEL_NAMES[i],
    w: W, tiles: g,
    spawnCol: 2, trophyCol: tCol, doorCol: dCol,
    pits, hills, plats, fires, spikes, coins, hearts, foes, jets,
  };
}
/*GEN_END*/

// ---------- runtime state ----------
let L = null, tiles = [];
let trophy = null, door = null, jets = [], hearts = [], coins = [];
let foes = [], bullets = [], flames = [], popups = [], parts = [];
let camX = 0, lvlName = "";
let levelIdx = 0, endless = false;

const pl = { x: 0, y: 0, w: 18, h: 28, vx: 0, vy: 0, dir: 1, ground: false, coyote: 0,
             inv: 0, anim: 0, dropT: 0, jet: false, fuel: 0, jetOn: false, cd: 0 };
let lives = 3, score = 0, hi = 0;
let state = "title", stT = 0;
let doorOpen = false, buzzT = 0;
let shakeT = 0, freezeT = 0, flashT = 0;

// run stats
let coinRun = 0, coin1upAt = 150, starsTotal = 0;
let lvlCoins = 0, deathsLvl = 0, combo = 0, comboT = 0, bestCombo = 0, lvlTime = 0;
let lastStars = 0;
try { hi = parseInt(localStorage.getItem("dd_hi3") || "0", 10) || 0; } catch (e) {}

// ---------- audio ----------
let actx = null, muted = false;
function tone(f, d, vol, slide, type) {
  if (muted) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === "suspended") actx.resume();
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type || "square";
    o.frequency.setValueAtTime(f, actx.currentTime);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, slide), actx.currentTime + d);
    g.gain.setValueAtTime(vol || 0.05, actx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + d);
    o.connect(g); g.connect(actx.destination);
    o.start(); o.stop(actx.currentTime + d);
  } catch (e) {}
}
const S = {
  jump:   () => tone(220, .15, .045, 520),
  coin:   (c) => tone(880 * (1 + Math.min(combo, 8) * 0.06), .06, .045),
  shoot:  () => tone(880, .06, .03, 300),
  jet:    () => tone(500, .3, .035, 220),
  stomp:  () => tone(150, .1, .05, 60),
  hurt:   () => tone(300, .25, .06, 90),
  door:   () => { [523, 659, 784].forEach((f, i) => setTimeout(() => tone(f, .12, .05), i * 90)); },
  locked: () => tone(110, .12, .05, 90),
  level:  () => { [392, 523, 659, 784].forEach((f, i) => setTimeout(() => tone(f, .13, .05), i * 100)); },
  over:   () => { [330, 262, 196, 131].forEach((f, i) => setTimeout(() => tone(f, .2, .06), i * 160)); },
  win:    () => { [523, 659, 784, 1046, 1318, 1568].forEach((f, i) => setTimeout(() => tone(f, .15, .05), i * 110)); },
  oneup:  () => { [659, 880, 1318].forEach((f, i) => setTimeout(() => tone(f, .12, .06), i * 90)); },
  star:   () => tone(1200, .1, .05, 2400),
};

// ---------- input ----------
const keys = {};
let jumpBuf = 0, dropQueued = false, enterQueued = false, shootQueued = false, jetQueued = false, retryQueued = false;
addEventListener("keydown", e => {
  const k = e.key;
  if (["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"," "].includes(k)) e.preventDefault();
  if (k === " " || k === "ArrowUp" || k === "w" || k === "W") jumpBuf = 0.12;
  if (k === "ArrowDown" || k === "s" || k === "S") dropQueued = true;
  if (k === "Enter") enterQueued = true;
  if (k === "m" || k === "M") muted = !muted;
  if (k === "Control" || k === "x" || k === "X" || k === "z" || k === "Z") shootQueued = true;
  if (k === "Shift") jetQueued = true;
  if (k === "r" || k === "R") retryQueued = true;
  keys[k] = true;
});
addEventListener("keyup", e => { keys[e.key] = false; });

// ---------- level helpers ----------
const SOLID = { "#": 1, G: 1, B: 1 };
function tileAt(c, r) {
  if (c < 0 || c >= L.w || r >= ROWS) return "X";
  if (r < 0) return " ";
  return tiles[r][c];
}
function solidAt(c, r) { const t = tileAt(c, r); return t === "X" || SOLID[t] === 1; }
function platAt(c, r) { return tileAt(c, r) === "-"; }
function spikeAt(c, r) { return tileAt(c, r) === "S"; }

function loadLevel(i) {
  levelIdx = i;
  L = genLevel(i);
  tiles = L.tiles;
  lvlName = L.name;
  trophy = { col: L.trophyCol };
  door = { col: L.doorCol };
  jets = L.jets.map(j => ({ x: j.col * TILE + 8, y: 10 * TILE + 12, got: false }));
  hearts = L.hearts.map(h => ({ x: h.col * TILE + 6, y: 9 * TILE + 12, got: false }));
  coins = L.coins.map(c => ({ x: c.x, y: c.y, got: false, spin: Math.random() * 6.28 }));
  foes = L.foes.map(f => f.kind === "w"
    ? { kind: "w", fast: f.fast, x: f.col * TILE + 6, y: 12 * TILE - 28, w: 20, h: 28, vx: 0, vy: 0, dir: -1, dead: false }
    : { kind: "g", x: f.col * TILE + 6, y: f.row * TILE + 8, w: 20, h: 20, t: Math.random() * 6.28, dead: false });
  flames = L.fires.map(c => ({ x: c * TILE + 4, t: Math.random() * 2.4, active: false }));
  bullets = []; popups = []; parts = [];
  doorOpen = false; lvlCoins = coins.length; deathsLvl = 0;
  combo = 0; comboT = 0; bestCombo = 0; lvlTime = 0;
  resetPlayer(); resetFoes();
}
function resetPlayer() {
  pl.x = L.spawnCol * TILE + 6;
  pl.y = 12 * TILE - pl.h - 2;
  pl.vx = 0; pl.vy = 0; pl.ground = false; pl.inv = 0; pl.dropT = 0; pl.jetOn = false; pl.cd = 0;
}
function resetFoes() {
  foes.forEach(f => {
    if (f.kind === "w") { f.x = Math.floor(f.x / TILE) * TILE + 6; f.y = 12 * TILE - 28; f.vx = 0; f.vy = 0; f.dir = -1; f.dead = false; }
    else f.dead = false;
  });
}
function newGame() { lives = 3; score = 0; endless = false; state = "intro"; stT = 0; loadLevel(0); }
function saveHi() { if (score > hi) { hi = score; try { localStorage.setItem("dd_hi3", String(hi)); } catch (e) {} } }

// ---------- juice helpers ----------
function shake(n) { shakeT = Math.max(shakeT, n); }
function hitstop(n) { freezeT = Math.max(freezeT, n); }
function addPop(x, y, txt, col) { popups.push({ x, y, txt, col, t: 0.9 }); }
function burst(x, y, col, n, spd) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * 6.28, v = (spd || 120) * (0.4 + Math.random() * 0.8);
    parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 60, t: 0.5 + Math.random() * 0.3, col });
  }
}
function mult() { return Math.min(combo, 9); }
function addScore(v) { score += v; }

function die() {
  if (pl.inv > 0) return;
  lives--; deathsLvl++; combo = 0; comboT = 0;
  S.hurt(); shake(6); hitstop(0.12);
  burst(pl.x + pl.w / 2, pl.y + pl.h / 2, "#e03028", 14, 160);
  if (lives < 0) { state = "over"; S.over(); saveHi(); }
  else { pl.inv = 2; resetFoes(); resetPlayer(); }
}

// ---------- physics ----------
const GRAV = 1500, MOVE = 210, JUMP = 570;

function rectHits(x, y, w, h) {
  const hits = [];
  const c0 = Math.floor(x / TILE), c1 = Math.floor((x + w - 1) / TILE);
  const r0 = Math.floor(y / TILE), r1 = Math.floor((y + h - 1) / TILE);
  for (let r = r0; r <= r1; r++) for (let c = c0; c <= c1; c++) {
    if (solidAt(c, r)) hits.push({ c, r, plat: false });
    else if (platAt(c, r)) hits.push({ c, r, plat: true });
  }
  return hits;
}

function movePlayer(dt) {
  if (pl.inv > 0) pl.inv -= dt;
  if (pl.dropT > 0) pl.dropT -= dt;
  if (pl.cd > 0) pl.cd -= dt;
  if (comboT > 0) { comboT -= dt; if (comboT <= 0) combo = 0; }
  lvlTime += dt;

  let mv = 0;
  if (keys["ArrowLeft"] || keys["a"] || keys["A"]) mv--;
  if (keys["ArrowRight"] || keys["d"] || keys["D"]) mv++;
  pl.vx = mv * MOVE;
  if (mv) { pl.dir = mv; pl.anim += dt * 9; } else pl.anim = 0;

  if (jumpBuf > 0) jumpBuf -= dt;
  if (pl.ground) pl.coyote = 0.09; else if (pl.coyote > 0) pl.coyote -= dt;

  const fc = Math.floor((pl.x + pl.w / 2) / TILE);
  const fr = Math.floor((pl.y + pl.h + 1) / TILE);
  if (dropQueued && pl.ground && platAt(fc, fr)) { pl.y += 4; pl.ground = false; pl.dropT = 0.2; }
  dropQueued = false;

  if (jetQueued && pl.jet && pl.fuel > 0) { pl.jetOn = !pl.jetOn; if (pl.jetOn) S.jet(); }
  jetQueued = false;
  if (pl.jetOn) {
    if (pl.fuel <= 0) pl.jetOn = false;
    else {
      pl.fuel -= dt;
      if (keys["ArrowUp"] || keys["w"] || keys["W"] || keys[" "]) pl.vy = Math.min(pl.vy - 1300 * dt, -340);
      pl.ground = false; pl.coyote = 0;
      if (Math.random() < dt * 30) burst(pl.x + pl.w / 2, pl.y + pl.h, "#ff8a2a", 1, 40);
    }
  } else if (jumpBuf > 0 && (pl.ground || pl.coyote > 0)) {
    pl.vy = -JUMP; pl.ground = false; pl.coyote = 0; jumpBuf = 0; S.jump();
    burst(pl.x + pl.w / 2, pl.y + pl.h, "#ccc", 3, 40);
  }

  pl.x += pl.vx * dt;
  let hits = rectHits(pl.x, pl.y, pl.w, pl.h).filter(h => !h.plat);
  for (const h of hits) {
    if (pl.vx > 0 && pl.x + pl.w > h.c * TILE + 2) pl.x = h.c * TILE - pl.w;
    else if (pl.vx < 0 && pl.x < (h.c + 1) * TILE - 2) pl.x = (h.c + 1) * TILE;
  }

  const prevBottom = pl.y + pl.h;
  pl.vy = Math.min(pl.vy + GRAV * dt, 800);
  pl.y += pl.vy * dt;
  const wasAir = !pl.ground;
  pl.ground = false;
  hits = rectHits(pl.x, pl.y, pl.w, pl.h);
  for (const h of hits) {
    const topY = h.plat ? h.r * TILE + 18 : h.r * TILE;
    if (h.plat) {
      if (pl.vy > 0 && prevBottom <= topY + 10 && pl.y + pl.h >= topY && pl.dropT <= 0 && !(keys["ArrowDown"] || keys["s"] || keys["S"])) {
        pl.y = topY - pl.h; pl.vy = 0; pl.ground = true;
      }
    } else {
      if (pl.vy > 0 && prevBottom <= h.r * TILE + 12 && pl.y + pl.h >= h.r * TILE) {
        pl.y = h.r * TILE - pl.h; pl.vy = 0; pl.ground = true;
        if (wasAir && pl.vy === 0) burst(pl.x + pl.w / 2, pl.y + pl.h, "#c8b080", 4, 50);
      } else if (pl.vy < 0 && pl.y < (h.r + 1) * TILE) {
        pl.y = (h.r + 1) * TILE; pl.vy = 0;
      }
    }
  }
  if (pl.x < 0) pl.x = 0;
  if (pl.x + pl.w > L.w * TILE) pl.x = L.w * TILE - pl.w;

  // spikes
  const feetC = Math.floor((pl.x + pl.w / 2) / TILE);
  const feetR = Math.floor((pl.y + pl.h + 2) / TILE);
  if (spikeAt(feetC, feetR) && pl.vy >= 0) { pl.y = feetR * TILE - pl.h + 4; die(); }

  if (pl.y > ROWS * TILE + 26) die();
}

function fireBullet() {
  if (pl.cd > 0) return;
  pl.cd = 0.18; S.shoot();
  bullets.push({ x: pl.x + (pl.dir > 0 ? pl.w : -6), y: pl.y + 11, dir: pl.dir });
}

function killFoe(f, byStomp) {
  if (f.dead) return;
  f.dead = true;
  combo = Math.min(combo + 1, 9); comboT = 2.2;
  bestCombo = Math.max(bestCombo, combo);
  const pts = (f.kind === "g" ? 150 : 100) * mult();
  addScore(pts);
  const cx = f.x + f.w / 2, cy = f.y + f.h / 2;
  addPop(cx, cy - 12, "+" + pts, mult() >= 3 ? "#ff9a2a" : "#fff");
  if (combo >= 2) addPop(cx, cy - 30, "COMBO x" + mult(), "#ffd700");
  burst(cx, cy, f.kind === "g" ? "#cfe8ff" : (f.fast ? "#e05545" : "#5cbf4e"), 10, 140);
  if (byStomp) { pl.vy = -330; pl.y = f.y - pl.h; }
  S.stomp(); shake(3); hitstop(0.06);
}

function moveFoes(dt) {
  for (const f of foes) {
    if (f.dead) continue;
    if (f.kind === "w") {
      const spd = f.fast ? 135 : 48 + levelIdx * 5;
      f.vx = f.dir * spd;
      f.vy = Math.min(f.vy + GRAV * dt, 800);
      f.x += f.vx * dt;
      let aheadC = Math.floor((f.x + (f.dir > 0 ? f.w + 2 : -2)) / TILE);
      let midR = Math.floor((f.y + f.h / 2) / TILE);
      if (solidAt(aheadC, midR)) f.dir *= -1;
      f.x = Math.max(0, Math.min(L.w * TILE - f.w, f.x));
      f.y += f.vy * dt;
      pushOut(f);
      aheadC = Math.floor((f.x + (f.dir > 0 ? f.w + 3 : -3)) / TILE);
      const belowR = Math.floor((f.y + f.h + 4) / TILE);
      if (!solidAt(aheadC, belowR) && !platAt(aheadC, belowR)) f.dir *= -1;
      if (f.y > ROWS * TILE + 30) f.dead = true;
      if (!f.dead && overlap(pl, f)) {
        if (pl.vy > 60 && pl.y + pl.h - f.y < 16) killFoe(f, true);
        else die();
      }
    } else {
      f.t += dt;
      const spd = 58 + levelIdx * 4;
      const dx = (pl.x + pl.w / 2) - (f.x + f.w / 2);
      const dy = (pl.y + 2) - (f.y + f.h / 2);
      f.x += Math.sign(dx) * Math.min(Math.abs(dx), spd * dt);
      f.y += Math.sign(dy) * Math.min(Math.abs(dy), spd * 0.8 * dt);
      const cc = Math.floor((f.x + f.w / 2) / TILE), rr = Math.floor((f.y + f.h / 2) / TILE);
      if (solidAt(cc, rr + 1) || solidAt(cc, rr)) f.y -= 80 * dt;
      f.x = Math.max(4, Math.min(L.w * TILE - f.w - 4, f.x));
      f.y = Math.max(HUD + 10, Math.min(ROWS * TILE - 34, f.y));
      if (overlap(pl, f)) die();
    }
  }
}
function pushOut(e) {
  let hits = rectHits(e.x, e.y, e.w, e.h).filter(h => !h.plat);
  for (const h of hits) {
    if (e.vy > 0 && e.y + e.h > h.r * TILE + 2) { e.y = h.r * TILE - e.h; e.vy = 0; }
    else if (e.vy < 0 && e.y < (h.r + 1) * TILE - 2) { e.y = (h.r + 1) * TILE; e.vy = 0; }
  }
}
function overlap(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}

function updateFlames(dt) {
  for (const fl of flames) {
    fl.t += dt;
    const cyc = fl.t % 2.6;
    fl.active = cyc > 1.9;
    if (!fl.active) continue;
    const fr = { x: fl.x + 2, y: 12 * TILE - 52, w: 24, h: 52 };
    if (overlap(pl, fr)) die();
  }
}

function collectCoin(c) {
  c.got = true; coinRun++;
  const v = 25;
  addScore(v);
  addPop(c.x, c.y - 8, "+" + v, "#ffe870");
  burst(c.x, c.y, "#ffd700", 5, 70);
  S.coin();
  if (coinRun >= coin1upAt) {
    coin1upAt += 150;
    if (lives < 9) { lives++; addPop(c.x, c.y - 30, "1UP!", "#ff6a6a"); S.oneup(); }
  }
}

function update(dt) {
  stT += dt;
  if (msgFlashT > 0) msgFlashT -= dt;
  if (buzzT > 0) buzzT -= dt;
  if (state === "intro") {
    if (stT > 1.2 || enterQueued) { enterQueued = false; state = "play"; }
    return;
  }
  if (state === "clear") {
    if (stT > 2.6 || enterQueued) {
      enterQueued = false;
      if (levelIdx + 1 >= LEVEL_NAMES.length && !endless) {
        // beat the game -> endless nightmare continues
        endless = true;
        addPop(VIEWW / 2, HUD + 120, "NIGHTMARE MODE!", "#ff6a6a");
        S.win();
        state = "intro"; stT = 0;
        loadLevel(levelIdx + 1);
      } else {
        state = "intro"; stT = 0;
        loadLevel(levelIdx + 1);
      }
    }
    return;
  }
  if (state !== "play") return;
  if (retryQueued) { retryQueued = false; loadLevel(levelIdx); return; }

  movePlayer(dt);

  if (shootQueued) { shootQueued = false; fireBullet(); }
  for (const b of bullets) {
    b.x += b.dir * 460 * dt;
    b.life = (b.life || 0) + dt;
  }
  bullets = bullets.filter(b => b.life < 0.9 && b.x > camX - 40 && b.x < camX + VIEWW + 40);
  for (const b of bullets) {
    for (const f of foes) {
      if (f.dead) continue;
      if (Math.abs(b.x - (f.x + f.w / 2)) < 14 && Math.abs(b.y - (f.y + f.h / 2)) < 16) {
        b.dead = true; killFoe(f, false);
      }
    }
  }
  bullets = bullets.filter(b => !b.dead);

  moveFoes(dt);
  updateFlames(dt);

  // coins
  const pcx = pl.x + pl.w / 2, pcy = pl.y + pl.h / 2;
  for (const c of coins) {
    if (c.got) continue;
    if (Math.abs(pcx - c.x) < 22 && Math.abs(pcy - c.y) < 26) collectCoin(c);
  }
  // hearts
  for (const h of hearts) {
    if (h.got) continue;
    if (Math.abs(pcx - (h.x + 8)) < 24 && Math.abs(pcy - h.y) < 30) {
      h.got = true;
      if (lives < 9) { lives++; addPop(h.x + 8, h.y - 10, "+1 LIFE", "#ff6a6a"); S.oneup(); }
      else addScore(500);
    }
  }
  // trophy
  if (trophy && !doorOpen) {
    const tx = trophy.col * TILE + 16, ty = 9 * TILE + 16;
    if (Math.abs(pcx - tx) < 26 && Math.abs(pcy - ty) < 34) {
      doorOpen = true;
      const pts = 1000 * mult();
      addScore(pts);
      addPop(tx, ty - 20, "TROPHY +" + pts, "#ffd700");
      burst(tx, ty, "#ffd700", 22, 190);
      S.door(); shake(5);
    }
  }
  // jetpacks
  for (const j of jets) {
    if (j.got) continue;
    if (Math.abs(pcx - (j.x + 8)) < 24 && Math.abs(pcy - j.y) < 30) {
      j.got = true; pl.jet = true; pl.fuel = Math.min(6, pl.fuel + 5);
      addPop(j.x + 8, j.y - 10, "JETPACK!", "#ff8a2a"); S.jet();
    }
  }

  // door
  if (door) {
    const dx = door.col * TILE, dy = 10 * TILE;
    const drect = { x: dx + 2, y: dy, w: 28, h: TILE * 2 };
    if (overlap(pl, drect)) {
      if (doorOpen) {
        // time bonus
        const par = 22 + levelIdx * 2 + L.w * 0.10;
        const tb = Math.max(0, Math.round((par - lvlTime) * 5));
        if (tb > 0) { addScore(tb); addPop(dx + 16, dy - 16, "TIME +" + tb, "#8ad4ff"); }
        // stars
        const pct = 1 - (coins.filter(c => !c.got).length / Math.max(1, lvlCoins));
        lastStars = 1;
        if (pct >= 0.6) lastStars = 2;
        if (pct >= 0.92 && deathsLvl === 0) lastStars = 3;
        starsTotal += lastStars;
        saveHi();
        state = "clear"; stT = 0;
        if (lastStars === 3) S.star();
        S.level();
      } else if (buzzT <= 0) { S.locked(); buzzT = 0.4; pl.x = Math.min(pl.x, dx - pl.w - 1); }
    }
  }

  // camera
  const target = pl.x + pl.w / 2 - VIEWW / 2;
  camX = Math.max(0, Math.min(L.w * TILE - VIEWW, target));

  // popups / particles
  for (const p of popups) p.t -= dt;
  popups = popups.filter(p => p.t > 0);
  for (const p of parts) { p.t -= dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 500 * dt; }
  parts = parts.filter(p => p.t > 0);

  if (keys["p"] || keys["P"]) { state = "pause"; keys["p"] = keys["P"] = false; }
}
let msgFlashT = 0;

// ============================== DRAWING ==============================
function rrect(x, y, w, h, col) { ctx.fillStyle = col; ctx.fillRect(Math.round(x), Math.round(y), w, h); }

function drawBg() {
  const grad = ctx.createLinearGradient(0, HUD, 0, VIEWH);
  grad.addColorStop(0, "#0a0a22"); grad.addColorStop(0.7, "#16103a"); grad.addColorStop(1, "#241a4a");
  ctx.fillStyle = grad; ctx.fillRect(0, HUD, VIEWW, VIEWH - HUD);
  ctx.fillStyle = "#6666aa";
  for (let i = 0; i < 50; i++) {
    const sx = (((i * 137 + camX * (0.2 + (i % 5) * 0.12))) % VIEWW + VIEWW) % VIEWW;
    const sy = HUD + ((i * 53) % (VIEWH - HUD - 130)) + 10;
    ctx.fillRect(sx, sy, (i % 3 === 0) ? 2 : 1, (i % 3 === 0) ? 2 : 1);
  }
}

function drawTiles() {
  const c0 = Math.max(0, Math.floor(camX / TILE) - 1);
  const c1 = Math.min(L.w - 1, c0 + Math.ceil(VIEWW / TILE) + 2);
  for (let r = 0; r < ROWS; r++) for (let c = c0; c <= c1; c++) {
    const ch = tiles[r][c];
    if (ch === " " || ch === "S") { if (ch === "S") drawSpikes(c); continue; }
    const x = c * TILE - camX, y = r * TILE;
    if (ch === "#") {
      rrect(x, y, TILE, TILE, "#7a4a2a");
      rrect(x + 2, y + 2, 12, 10, "#8a5a36");
      rrect(x + 18, y + 2, 12, 10, "#8a5a36");
      rrect(x + 2, y + 16, 12, 10, "#8a5a36");
      rrect(x + 18, y + 16, 12, 10, "#8a5a36");
      rrect(x, y, TILE, 2, "#5a3218");
    } else if (ch === "G") {
      rrect(x, y, TILE, TILE, "#7a4a2a");
      rrect(x, y, TILE, 8, "#4caf50");
      rrect(x, y, TILE, 3, "#2e7d32");
      rrect(x + 6, y + 14, 6, 4, "#8a5a36");
      rrect(x + 20, y + 22, 6, 4, "#8a5a36");
    } else if (ch === "-") {
      rrect(x, y + 14, TILE, 18, "#8a5a2a");
      rrect(x, y + 14, TILE, 3, "#6e421e");
      rrect(x, y + 28, TILE, 4, "#6e421e");
    }
  }
  // water
  for (let c = c0; c <= c1; c++) {
    if (tiles[12][c] !== "G") {
      const x = c * TILE - camX;
      rrect(x, ROWS * TILE, TILE, VIEWH - ROWS * TILE, "#12407a");
      rrect(x, ROWS * TILE, TILE, 3, "#2a6ab0");
      rrect(x + 8 + (Math.floor(stT * 4 + c) % 10), ROWS * TILE + 12, 6, 2, "#2a6ab0");
    }
  }
}
function drawSpikes(c) {
  const x = c * TILE - camX, y = 12 * TILE - 12;
  for (let i = 0; i < 4; i++) {
    const px = x + i * 8;
    ctx.fillStyle = "#c8c8d8";
    ctx.beginPath();
    ctx.moveTo(px + 1, y + 12); ctx.lineTo(px + 4, y); ctx.lineTo(px + 7, y + 12);
    ctx.closePath(); ctx.fill();
  }
  rrect(x, y + 12, TILE, 4, "#7a7a8a");
}

function drawFlames() {
  for (const fl of flames) {
    if (!fl.active) continue;
    const x = fl.x - camX, base = 12 * TILE;
    const h = 40 + Math.sin(fl.t * 30) * 10;
    ctx.fillStyle = "#ff4a00";
    ctx.beginPath();
    ctx.moveTo(x, base); ctx.lineTo(x + 4, base - h * 0.6); ctx.lineTo(x + 12, base - h); ctx.lineTo(x + 20, base - h * 0.6); ctx.lineTo(x + 24, base);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = "#ffc800";
    ctx.beginPath();
    ctx.moveTo(x + 6, base); ctx.lineTo(x + 10, base - h * 0.45); ctx.lineTo(x + 12, base - h * 0.5); ctx.lineTo(x + 16, base - h * 0.4); ctx.lineTo(x + 18, base);
    ctx.closePath(); ctx.fill();
  }
}

function drawCoins() {
  for (const c of coins) {
    if (c.got) continue;
    c.spin += 0.12;
    const s = Math.abs(Math.cos(c.spin));
    const w = Math.max(3, 10 * s);
    const x = c.x - camX;
    rrect(x - w / 2, c.y - 7, w, 14, "#d4a017");
    rrect(x - w / 2, c.y - 7, w, 4, "#f6d155");
    if (s > 0.85) rrect(x - 1, c.y - 4, 2, 8, "#fff0a0");
  }
}

function drawHearts() {
  for (const h of hearts) {
    if (h.got) continue;
    const x = h.x + 8 - camX, y = h.y + Math.sin(stT * 4) * 2;
    ctx.fillStyle = "#ff4a5a";
    ctx.beginPath();
    ctx.arc(x - 4, y, 5, 0, 6.28); ctx.arc(x + 4, y, 5, 0, 6.28);
    ctx.fill();
    ctx.fillStyle = "#ff6a7a";
    ctx.beginPath();
    ctx.moveTo(x - 9, y + 1); ctx.lineTo(x, y + 12); ctx.lineTo(x + 9, y + 1);
    ctx.closePath(); ctx.fill();
  }
}

function drawTrophy() {
  if (!trophy || doorOpen) return;
  const x = trophy.col * TILE + 16 - 9 - camX, by = 9 * TILE + 6 + Math.sin(stT * 3) * 2;
  rrect(x + 3, by + 10, 10, 2, "#b8860b");
  rrect(x + 5, by + 2, 6, 9, "#ffd700");
  rrect(x + 5, by - 4, 6, 6, "#ffd700");
  rrect(x + 7, by - 6, 2, 2, "#fff6c0");
  rrect(x + 5, by + 12, 2, 4, "#ffd700");
  rrect(x + 9, by + 12, 2, 4, "#ffd700");
}

function drawJets() {
  for (const j of jets) {
    if (j.got) continue;
    const x = j.x + 8 - 10 - camX, y = j.y - 8 + Math.sin(stT * 4) * 2;
    rrect(x + 3, y + 8, 14, 6, "#8a8a9a");
    rrect(x + 5, y + 2, 10, 8, "#d0d0e0");
    rrect(x + 7, y + 12, 6, 5, "#ff8a2a");
    rrect(x + 8, y + 17, 4, 4, "#ffc800");
    rrect(x + 5, y + 2, 10, 2, "#fff");
  }
}

function drawDoor() {
  if (!door) return;
  const x = door.col * TILE - camX, y = 10 * TILE;
  const col1 = doorOpen ? "#ffd700" : "#9a6a3a";
  rrect(x + 2, y, 28, TILE * 2, col1);
  rrect(x + 6, y + 4, 20, TILE * 2 - 8, "#2a1a0a");
  if (doorOpen) {
    const a = 0.25 + 0.2 * Math.sin(stT * 8);
    rrect(x, y - 4, 32, TILE * 2 + 8, `rgba(255,215,0,${a.toFixed(2)})`);
    rrect(x + 10, y + 8, 12, 26, "#fff6c0");
  } else {
    rrect(x + 12, y + 14, 8, 7, "#c8b060");
    rrect(x + 14, y + 11, 4, 4, "#c8b060");
    rrect(x + 15, y + 16, 2, 3, "#2a1a0a");
  }
}

function drawFoes() {
  for (const f of foes) {
    if (f.dead) continue;
    const x = f.x - camX;
    if (f.kind === "w") {
      const body = f.fast ? "#e05545" : "#5cbf4e";
      const dark = f.fast ? "#a03020" : "#2e8a24";
      rrect(x, f.y + 6, f.w, f.h - 6, body);
      rrect(x - 2, f.y + 6, f.w + 4, 6, dark);
      rrect(x + (f.dir > 0 ? f.w - 6 : 0), f.y + 10, 6, 8, "#fff");
      rrect(x + (f.dir > 0 ? f.w - 4 : 2), f.y + 12, 2, 4, "#111");
      rrect(x, f.y + f.h - 3, f.w, 3, dark);
    } else {
      ctx.globalAlpha = 0.75;
      rrect(x, f.y + 4, f.w, f.h - 4, "#cfe8ff");
      rrect(x, f.y + 4, f.w, 6, "#9ad4ff");
      rrect(x + 4, f.y + 10, 3, 3, "#204060");
      rrect(x + 13, f.y + 10, 3, 3, "#204060");
      ctx.globalAlpha = 1;
    }
  }
}

function drawBullets() {
  ctx.fillStyle = "#ffe870";
  for (const b of bullets) ctx.fillRect(b.x - camX - 2, b.y - 2, 10, 4);
}

function drawPlayer() {
  if (pl.inv > 0 && Math.floor(pl.inv * 12) % 2 === 0) return;
  const x = pl.x - camX, y = pl.y;
  const run = Math.abs(pl.vx) > 10 && pl.ground;
  const leg = run ? Math.floor(pl.anim) % 2 : 0;
  rrect(x + 2 + (leg ? 2 : 0), y + 20, 6, 8, "#2b5bc4");
  rrect(x + 10 - (leg ? 2 : 0), y + 20, 6, 8, "#2b5bc4");
  rrect(x, y + 12, 18, 9, "#e03028");
  rrect(x, y + 12, 18, 2, "#a01810");
  rrect(x + (pl.dir > 0 ? 17 : -1), y + 13, 2, 7, "#e0a878");
  rrect(x + 3, y + 2, 12, 11, "#e0a878");
  rrect(x + 3, y + 2, 12, 4, "#5a3a1a");
  rrect(x + (pl.dir > 0 ? 12 : 3), y + 6, 3, 3, "#fff");
  rrect(x + (pl.dir > 0 ? 13 : 5), y + 7, 2, 2, "#111");
  rrect(x + (pl.dir > 0 ? 17 : -3), y + 15, 4, 3, "#444");
}

function drawCombo() {
  if (combo < 2 || comboT <= 0 || state !== "play") return;
  const w = 150;
  const x = VIEWW / 2 - w / 2;
  const frac = Math.min(1, comboT / 2.2);
  ctx.fillStyle = "rgba(0,0,0,0.5)"; ctx.fillRect(x - 6, HUD + 8, w + 12, 30);
  ctx.fillStyle = "rgba(0,0,0,0.6)"; ctx.fillRect(x - 6, HUD + 38, w + 12, 6);
  ctx.fillStyle = mult() >= 5 ? "#ff6a2a" : "#ffd700";
  ctx.fillRect(x - 6, HUD + 38, (w + 12) * frac, 6);
  ctx.fillStyle = mult() >= 5 ? "#ff9a5a" : "#ffd700";
  ctx.font = "bold 20px 'Courier New',monospace";
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillText("COMBO x" + mult(), VIEWW / 2, HUD + 23);
}

function drawPopups() {
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  for (const p of popups) {
    ctx.globalAlpha = Math.min(1, p.t / 0.4);
    ctx.fillStyle = p.col || "#fff";
    ctx.font = "bold 14px 'Courier New',monospace";
    ctx.fillText(p.txt, p.x - camX, p.y - (0.9 - p.t) * 46);
    ctx.globalAlpha = 1;
  }
}
function drawParts() {
  for (const p of parts) {
    ctx.globalAlpha = Math.min(1, p.t / 0.3);

    ctx.fillRect(p.x - camX - 1, p.y - 1, 3, 3);

function drawHUD() {
  rrect(0, 0, VIEWW, HUD, "#141428");
  rrect(0, HUD - 2, VIEWW, 2, "#3a3a5a");
  ctx.textAlign = "left"; ctx.textBaseline = "middle";

  ctx.fillText(coinRun, 262, 19);

    ctx.fillText("Kill enemies fast to build the combo. Grab the trophy, then the door.", 320, 330);
    ctx.fillText("150 coins = extra life. 3 stars a level = all coins, no deaths.", 320, 354);
  } else if (state === "intro") {
    ctx.fillStyle = "#ffd700"; ctx.font = "bold 34px 'Courier New',monospace";
    ctx.fillText((endless ? "NIGHTMARE " : "LEVEL ") + (levelIdx + 1), 320, 176);
    ctx.fillStyle = "#9ad48a"; ctx.font = "bold 18px 'Courier New',monospace";
    ctx.fillText(lvlName, 320, 218);
    if (endless) {
      ctx.fillStyle = "#ff6a6a"; ctx.font = "bold 14px 'Courier New',monospace";
      ctx.fillText("IT NEVER ENDS. HOW FAR CAN YOU GO?", 320, 250);
    } else {
      ctx.fillStyle = "#8a8ac0"; ctx.font = "bold 12px 'Courier New',monospace";
      ctx.fillText("GRAB THE TROPHY  >  REACH THE DOOR  (3 STARS FOR A PERFECT RUN)", 320, 250);
    }
  } else if (state === "clear") {
    ctx.fillStyle = "#ffd700"; ctx.font = "bold 34px 'Courier New',monospace";
    ctx.fillText("LEVEL CLEAR!", 320, 120);
    // stars
    for (let i = 0; i < 3; i++) {
      ctx.fillStyle = i < lastStars ? "#ffd700" : "#444";
      ctx.font = "bold 44px 'Courier New',monospace";
      ctx.fillText("★", 260 + i * 60, 175);
    }
    const pct = Math.round(100 * (1 - coins.filter(c => !c.got).length / Math.max(1, lvlCoins)));
    ctx.fillStyle = "#c0c0e0"; ctx.font = "bold 15px 'Courier New',monospace";
    ctx.fillText("COINS " + pct + "%   DEATHS " + deathsLvl + "   BEST COMBO x" + bestCombo, 320, 235);
    ctx.fillStyle = "#8a8ac0"; ctx.font = "bold 13px 'Courier New',monospace";
    ctx.fillText("STAR TOTAL: " + starsTotal, 320, 275);
    if (lastStars === 3) {
      ctx.fillStyle = "#9ad48a"; ctx.font = "bold 15px 'Courier New',monospace";
      ctx.fillText("PERFECT LEVEL! ALL COINS, NO DEATHS!", 320, 305);
    }
  } else if (state === "over") {
    ctx.fillStyle = "#e05545"; ctx.font = "bold 44px 'Courier New',monospace";
    ctx.fillText("GAME OVER", 320, 150);
    ctx.fillStyle = "#ffd700"; ctx.font = "bold 24px 'Courier New',monospace";
    ctx.fillText("SCORE " + score, 320, 210);
    ctx.fillStyle = "#c0c0e0"; ctx.font = "bold 15px 'Courier New',monospace";
    ctx.fillText("STARS " + starsTotal + "   COINS " + coinRun, 320, 246);
    if (score >= hi && score > 0) { ctx.fillStyle = "#9ad48a"; ctx.fillText("NEW HIGH SCORE!", 320, 282); }
    if (Math.floor(stT * 1.5) % 2 === 0) {
      ctx.fillStyle = "#fff"; ctx.font = "bold 18px 'Courier New',monospace";
      ctx.fillText("PRESS ENTER", 320, 330);
    }
  } else if (state === "win") {
    ctx.fillStyle = "#ffd700"; ctx.font = "bold 44px 'Courier New',monospace";
    ctx.fillText("YOU BEAT CLYDE!", 320, 140);
    ctx.fillStyle = "#c0c0e0"; ctx.font = "bold 16px 'Courier New',monospace";
    ctx.fillText("But the nightmare is just beginning...", 320, 196);
    ctx.fillStyle = "#ff6a6a"; ctx.font = "bold 20px 'Courier New',monospace";
    ctx.fillText("NIGHTMARE MODE UNLOCKED", 320, 240);
    ctx.fillStyle = "#ffd700"; ctx.font = "bold 22px 'Courier New',monospace";
    ctx.fillText("SCORE " + score, 320, 282);
    if (Math.floor(stT * 1.5) % 2 === 0) {
      ctx.fillStyle = "#fff"; ctx.font = "bold 18px 'Courier New',monospace";
      ctx.fillText("PRESS ENTER TO CONTINUE", 320, 340);
    }
  } else if (state === "pause") {
    ctx.fillStyle = "#fff"; ctx.font = "bold 36px 'Courier New',monospace";
    ctx.fillText("PAUSED", 320, 220);
    ctx.fillStyle = "#8a8ac0"; ctx.font = "bold 14px 'Courier New',monospace";
    ctx.fillText("PRESS P TO RESUME", 320, 270);
  }
}

function draw() {
  ctx.save();
  if (shakeT > 0) {
    ctx.translate((Math.random() - 0.5) * shakeT * 2, (Math.random() - 0.5) * shakeT * 2);
    shakeT = Math.max(0, shakeT - 0.4);
  }
  drawBg();
  drawTiles();
  drawFlames();
  drawCoins();
  drawHearts();
  drawTrophy();
  drawJets();
  drawDoor();
  drawFoes();
  drawBullets();
  drawParts();
  drawPlayer();
  ctx.restore();
  drawHUD();
  drawCombo();
  drawPopups();
  if (["title", "intro", "clear", "over", "win", "pause"].includes(state)) drawOverlay();
}

// ---------- loop ----------
let last = 0;
function frame(ts) {
  const dt = Math.min(0.033, (ts - last) / 1000 || 0.016);
  last = ts;
  if (freezeT > 0) { freezeT -= dt; draw(); requestAnimationFrame(frame); return; }
  if (state === "title") {
    stT += dt;
    if (enterQueued) { enterQueued = false; state = "intro"; stT = 0; loadLevel(0); }
  } else if (state === "over" || state === "win") {
    stT += dt;
    if (enterQueued) { enterQueued = false; newGame(); }
  } else if (state === "pause") {
    if (keys["p"] || keys["P"]) { state = "play"; keys["p"] = keys["P"] = false; }
    if (enterQueued) enterQueued = false;
  } else {
    update(dt);
  }
  draw();
  requestAnimationFrame(frame);
}

loadLevel(0);
requestAnimationFrame(frame);
</script>
</body>
</html>
