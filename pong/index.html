<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pong!</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #1a1a2e;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    font-family: 'Segoe UI', system-ui, sans-serif;
    overflow: hidden;
    user-select: none;
  }
  #game-wrapper {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
  }
  canvas {
    border-radius: 12px;
    box-shadow: 0 0 40px rgba(100, 100, 255, 0.3);
  }
  #scoreboard {
    display: flex;
    gap: 80px;
    color: #fff;
    font-size: 28px;
    font-weight: 700;
  }
  .score-box {
    text-align: center;
    padding: 10px 24px;
    border-radius: 10px;
    min-width: 100px;
  }
  .score-left { background: #e94560; }
  .score-right { background: #0f3460; }
  .score-label { font-size: 12px; opacity: 0.8; text-transform: uppercase; letter-spacing: 1px; }
  .score-num { font-size: 36px; line-height: 1.2; }
  .key-hint { color: #888; font-size: 12px; margin-top: 4px; }
  #message {
    color: #ffd700;
    font-size: 18px;
    min-height: 28px;
    text-align: center;
    font-weight: 600;
  }
</style>
</head>
<body>
<div id="game-wrapper">
  <div id="scoreboard">
    <div class="score-box score-left">
      <div class="score-label">Leo</div>
      <div class="score-num" id="score-left">0</div>
    </div>
    <div class="score-box score-right">
      <div class="score-label">Nate</div>
      <div class="score-num" id="score-right">0</div>
    </div>
  </div>
  <canvas id="game" width="800" height="450"></canvas>
  <div id="message">Press SPACE to start!</div>
  <div class="key-hint">Leo: W / S &nbsp;|&nbsp; Nate: ↑ / ↓</div>
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const msgEl = document.getElementById('message');
const scoreLeftEl = document.getElementById('score-left');
const scoreRightEl = document.getElementById('score-right');

const WIN_SCORE = 5;

// Paddles
const PADDLE_W = 16;
const PADDLE_H = 110;
const PADDLE_SPEED = 6;

// Ball
const BALL_R = 12;
const INITIAL_BALL_SPEED = 4.5;
const MAX_BALL_SPEED = 12;
const SPEED_INC = 0.4;

// State
let leftY, rightY;
let ballX, ballY, ballDX, ballDY;
let scoreLeft, scoreRight;
let gameRunning = false;
let gameOver = false;
let keys = {};
let particles = [];
let hitFlash = 0;

function resetBall(direction) {
  ballX = canvas.width / 2;
  ballY = canvas.height / 2;
  const speed = INITIAL_BALL_SPEED;
  const angle = (Math.random() * 0.8 - 0.4); // -0.4 to 0.4 radians
  ballDX = direction * speed * Math.cos(angle);
  ballDY = speed * Math.sin(angle);
}

function resetGame() {
  leftY = canvas.height / 2 - PADDLE_H / 2;
  rightY = canvas.height / 2 - PADDLE_H / 2;
  scoreLeft = 0;
  scoreRight = 0;
  gameOver = false;
  particles = [];
  hitFlash = 0;
  updateScore();
  resetBall(Math.random() > 0.5 ? 1 : -1);
}

function updateScore() {
  scoreLeftEl.textContent = scoreLeft;
  scoreRightEl.textContent = scoreRight;
}

function spawnParticles(x, y, color) {
  for (let i = 0; i < 12; i++) {
    particles.push({
      x, y,
      vx: (Math.random() - 0.5) * 5,
      vy: (Math.random() - 0.5) * 5,
      life: 1,
      decay: 0.02 + Math.random() * 0.04,
      color,
      size: 2 + Math.random() * 4
    });
  }
}

function drawPaddle(x, y, color) {
  // Glow
  ctx.shadowColor = color;
  ctx.shadowBlur = 15;
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.roundRect(x, y, PADDLE_W, PADDLE_H, 8);
  ctx.fill();
  ctx.shadowBlur = 0;
}

function drawBall(x, y) {
  const gradient = ctx.createRadialGradient(x - 2, y - 2, 2, x, y, BALL_R);
  gradient.addColorStop(0, '#ffffff');
  gradient.addColorStop(0.6, '#ffd700');
  gradient.addColorStop(1, '#ff8c00');
  ctx.shadowColor = '#ffd700';
  ctx.shadowBlur = 20;
  ctx.fillStyle = gradient;
  ctx.beginPath();
  ctx.arc(x, y, BALL_R, 0, Math.PI * 2);
  ctx.fill();
  ctx.shadowBlur = 0;
}

function drawCenterLine() {
  ctx.strokeStyle = 'rgba(255,255,255,0.15)';
  ctx.setLineDash([10, 15]);
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(canvas.width / 2, 0);
  ctx.lineTo(canvas.width / 2, canvas.height);
  ctx.stroke();
  ctx.setLineDash([]);
}

function draw() {
  // Background
  ctx.fillStyle = '#16213e';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Hit flash
  if (hitFlash > 0) {
    ctx.fillStyle = `rgba(255, 255, 150, ${hitFlash * 0.15})`;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    hitFlash -= 0.03;
  }

  drawCenterLine();

  // Particles
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.life -= p.decay;
    if (p.life <= 0) { particles.splice(i, 1); continue; }
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  // Paddles
  drawPaddle(0, leftY, '#e94560');
  drawPaddle(canvas.width - PADDLE_W, rightY, '#0f3460');

  // Ball
  drawBall(ballX, ballY);
}

function update() {
  if (!gameRunning || gameOver) return;

  // Paddle movement
  if (keys['w'] || keys['W']) leftY = Math.max(0, leftY - PADDLE_SPEED);
  if (keys['s'] || keys['S']) leftY = Math.min(canvas.height - PADDLE_H, leftY + PADDLE_SPEED);
  if (keys['ArrowUp']) rightY = Math.max(0, rightY - PADDLE_SPEED);
  if (keys['ArrowDown']) rightY = Math.min(canvas.height - PADDLE_H, rightY + PADDLE_SPEED);

  // Ball movement
  ballX += ballDX;
  ballY += ballDY;

  // Top/bottom bounce
  if (ballY - BALL_R <= 0) {
    ballY = BALL_R;
    ballDY = Math.abs(ballDY);
  }
  if (ballY + BALL_R >= canvas.height) {
    ballY = canvas.height - BALL_R;
    ballDY = -Math.abs(ballDY);
  }

  // Left paddle hit
  if (ballX - BALL_R <= PADDLE_W &&
      ballY >= leftY && ballY <= leftY + PADDLE_H &&
      ballDX < 0) {
    ballX = PADDLE_W + BALL_R;
    ballDX = Math.abs(ballDX);
    // Adjust angle based on where ball hits paddle
    const hitPos = (ballY - leftY) / PADDLE_H; // 0 to 1
    const maxAngle = 0.8;
    ballDY = (hitPos - 0.5) * 2 * maxAngle * ballDX;
    // Speed up
    const currentSpeed = Math.sqrt(ballDX * ballDX + ballDY * ballDY);
    const newSpeed = Math.min(currentSpeed + SPEED_INC, MAX_BALL_SPEED);
    const scale = newSpeed / currentSpeed;
    ballDX *= scale;
    ballDY *= scale;
    spawnParticles(ballX + BALL_R, ballY, '#e94560');
    hitFlash = 1;
  }

  // Right paddle hit
  if (ballX + BALL_R >= canvas.width - PADDLE_W &&
      ballY >= rightY && ballY <= rightY + PADDLE_H &&
      ballDX > 0) {
    ballX = canvas.width - PADDLE_W - BALL_R;
    ballDX = -Math.abs(ballDX);
    const hitPos = (ballY - rightY) / PADDLE_H;
    const maxAngle = 0.8;
    ballDY = (hitPos - 0.5) * 2 * maxAngle * Math.abs(ballDX);
    const currentSpeed = Math.sqrt(ballDX * ballDX + ballDY * ballDY);
    const newSpeed = Math.min(currentSpeed + SPEED_INC, MAX_BALL_SPEED);
    const scale = newSpeed / currentSpeed;
    ballDX *= scale;
    ballDY *= scale;
    spawnParticles(ballX - BALL_R, ballY, '#0f3460');
    hitFlash = 1;
  }

  // Scoring
  if (ballX < -BALL_R * 2) {
    scoreRight++;
    updateScore();
    if (scoreRight >= WIN_SCORE) {
      gameOver = true;
      gameRunning = false;
      msgEl.textContent = '🎉 NATE WINS! 🎉  Press SPACE to play again';
    } else {
      msgEl.textContent = `Point Nate! ${WIN_SCORE - scoreRight} to go`;
      resetBall(1);
    }
  }
  if (ballX > canvas.width + BALL_R * 2) {
    scoreLeft++;
    updateScore();
    if (scoreLeft >= WIN_SCORE) {
      gameOver = true;
      gameRunning = false;
      msgEl.textContent = '🎉 LEO WINS! 🎉  Press SPACE to play again';
    } else {
      msgEl.textContent = `Point Leo! ${WIN_SCORE - scoreLeft} to go`;
      resetBall(-1);
    }
  }
}

function gameLoop() {
  update();
  draw();
  requestAnimationFrame(gameLoop);
}

// Input
window.addEventListener('keydown', e => {
  keys[e.key] = true;

  if (e.key === ' ') {
    e.preventDefault();
    if (gameOver) {
      resetGame();
      gameRunning = true;
      msgEl.textContent = 'Go!';
    } else if (!gameRunning) {
      gameRunning = true;
      msgEl.textContent = 'Go!';
    }
  }

  // Prevent arrow scrolling
  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].includes(e.key)) {
    e.preventDefault();
  }
});

window.addEventListener('keyup', e => {
  keys[e.key] = false;
});

// reset initial
resetGame();
gameLoop();
</script>
</body>
</html>
